name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: the engine sweep against its goldens
        run: cargo run --release --locked --bin parity -- --check parity

  runner:
    name: the engine sweep through the game's runner, and the game's gates
    runs-on: ubuntu-latest
    env:
      # The game commit whose runner, scripts and judges this checkout is
      # held to (parity/README.md, "Changing a rule").
      SERVER_COMMIT: 3c919d5da82c9193ae98added2824f5677d66728
    steps:
      # Side by side, not one inside the other: the game's extension is a
      # crate of its own, and inside this checkout cargo would read it as a
      # member of this workspace.
      - uses: actions/checkout@v4
        with:
          path: engine
      - uses: actions/checkout@v4
        with:
          repository: renderedstep/server
          ref: ${{ env.SERVER_COMMIT }}
          path: server
      - name: install the extension's build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libclang-dev sqlite3
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine -> target
            server/ext/renderedstep -> target
      - run: cargo build --release --locked --bin parity
        working-directory: engine
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: server
          bundler-cache: true
      - name: load the game's test schema
        working-directory: server
        env:
          RAILS_ENV: test
        run: bin/rails db:schema:load
      - name: build the game's extension against this checkout
        working-directory: server
        run: ENGINE_SOURCE="$GITHUB_WORKSPACE/engine" bin/rails engine:build
      - name: every script through the game's runner, against this repository's goldens
        run: engine/parity/runner.sh server engine/target/release/parity
      - name: the game's gates against this repository's goldens (the goldens as Ruby reads the rows, the invariants, the doctor and the audit)
        working-directory: server
        env:
          RAILS_ENV: test
        run: GOLDENS="$GITHUB_WORKSPACE/engine/parity/goldens" bin/rails engine:rust_gates
