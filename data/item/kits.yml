# What stands in a room of each sort, what lies on top of it, and what small
# stuff lies about: the tables a room is furnished from as it is written,
# keyed on its kind and its density (`location/kind.yml`). Owned by this
# engine and read by `src/kit.rs`, and by the game's `Item::Kit` through its
# extension, which declares this file's shape. Every name here becomes a
# record and is stated to the room writer before it describes the room: an
# edit is a prompt change and needs a baseline (the game's AGENTS.md).
#
# The names are meant for any setting a story may have, as the kinds are: a
# desk, a locker and a pipe run are a desk, a locker and a pipe run in a
# walled town, a modern city or a ship between planets.
#
# `kit_die` is thrown once for every piece a kind lists, and the piece is
# there when it comes up at or under the piece's share: a share of 6 is always
# there, 3 is a coin toss. `visible` is the most a kit may put in one room --
# the pieces, what lies on them and the small stuff, together -- so the room
# stays under the game's cap on what one room shows once its writer has added
# its own few things.
#
# `density` is how many small things lie about in a room of each word, one of
# the list drawn; a room with no word has none. `kinds` lists each sort's
# pieces with their shares, in the order they are thrown, and the small stuff
# that may lie about in it, drawn without a name twice.
#
# `pieces` says what each piece is. Fixed in place: `closed` with a shut
# inside nobody has looked in, `top` with things lying on it, `hollow` with
# things lying in it in plain view, or `nothing` holding neither. Or a bulk
# (`light`, `handy`, `heavy`) for a piece that stands here and can be carried
# off. `holding` names what lies on or in a fixed piece in plain view -- a
# closed piece may have a top too -- and `pools` each one's count and the
# names it is drawn from, never a name twice in one room.
#
# `readable` names the things with words on them: born with none, written
# once the first time somebody reads one. `use_kinds` gives a thing a use
# other than `ordinary`, and `combustible` names what a firestarter burns.
---
