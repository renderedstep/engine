# What sort of place a room is, how much small stuff lies about in it, and
# which sort each room of a building is dealt. Owned by this engine and read
# by `src/kind.rs`, and by the game's `Location::Kind` through its extension,
# which declares this file's shape. Every word here is sent to a model: an
# edit is a prompt change and needs a baseline (the game's AGENTS.md).
#
# The words are meant for any setting a story may have -- a walled town, a
# modern city, a ship between planets -- and each names one sort of place
# only. They are a first cut and will be revisited.
#
# A building deals its rooms by where they are in it: `entry` is the room its
# way in opens onto, `ground` the rest of that storey, `above` the storeys
# over it and `below` the storeys under it, each band dealt in turn from the
# top. For a ship or a station a storey is a deck: the entry is the airlock,
# `ground` the rest of the deck it opens onto, and `above` and `below` the
# decks over and under that one.
---
