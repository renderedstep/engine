[workspace]
members = ["."]
resolver = "2"

[package]
name = "renderedstep-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "The text-adventure engine's pure rules: the dice, the geometry and reading a typed line"
repository = "https://github.com/renderedstep/engine"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
yaml-rust2 = "0.13"
