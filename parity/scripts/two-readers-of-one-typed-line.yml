      content:
        intent: drop
        target_drop: player_item_1
        also_named: nothing
        named_more_than_one: 0.91
        target_present: 0.9
    - purpose: narration
      content: You set the coin down and keep your hands to yourself.
  expect:
    carrying: []
    here:
    - red coin
    resolved_by: typed_model_unsure
    changed: true
    refused: false
- id: a-free-throw-is-pointed-at-the-command
  type: throw the coin at Maren
  browser:
    token: throw
    local_reader: true
  expect:
    refused: true
    changed: false
    offers:
    - "/throw <thing> at <somebody here"
    - or a way out>
    here:
    - red coin
- id: a-reader-that-is-down-refuses-the-line
  type: pick the coin up again
  browser:
    token: down
    replies:
    - purpose: local_classifier
      unavailable: true
  expect:
    refused: true
    changed: false
    offers:
    - the slash menu lists them
    here:
    - red coin
